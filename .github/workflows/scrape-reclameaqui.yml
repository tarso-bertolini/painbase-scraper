name: scrape-reclameaqui

# Reclame Aqui scraper — Scrapling/StealthyFetcher (Python).
#
# Runs on a 6-hour cadence and on demand. Public repo = unmetered
# GHA minutes, so the cron can be aggressive without burning quota.
#
# Migrated from the original Playwright/TS implementation: Scrapling's
# StealthyFetcher uses Camoufox (a stealth-tuned Firefox fork) which
# defeats RA's Cloudflare Turnstile gate where vanilla Playwright +
# stealth-plugin couldn't.

on:
  # Schedule disabled — RA is silently anti-bot-blocking our session.
  # Their /items XHR returns an empty `{data: []}` template for every
  # bare call (proven across 5 workflow runs on 2026-05-11), and
  # their SSR'd HTML contains no /relato/ links to fall back to.
  # The OTHER iosite endpoints (pageviews, companypagealert) return
  # real content, so it's specifically the complaints endpoint that's
  # gated. Re-enable when we have a residential proxy or a working
  # bypass; until then the cron just burns 30 min of GHA quota per
  # run for zero ingest.
  #
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: 'Space-separated RA company slugs (default: BR fintech set)'
        required: false
        default: ''

concurrency:
  group: scrape-reclameaqui
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Scrapling's StealthyFetcher uses Camoufox (Firefox) as the
      # primary browser, but `solve_cloudflare=True` internally spins
      # up a Playwright Chromium instance for Turnstile challenges.
      # We need BOTH browsers cached.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium firefox

      # Camoufox bundles its own Firefox build (~120MB). Cache the
      # download dir so we only pay the install once per Camoufox
      # version bump, not on every run.
      - name: Cache Camoufox browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-${{ hashFiles('requirements.txt') }}

      - name: Install Camoufox + system deps
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: |
          python -m camoufox fetch
          # System libs Firefox needs on minimal Ubuntu runners.
          # (playwright install --with-deps installs most of these too,
          #  but Camoufox's bundled Firefox uses a slightly different
          #  set of libs — keep this step as belt-and-suspenders.)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libasound2t64 libdbus-glib-1-2 libxt6

      - name: Scrape
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "${{ inputs.brands }}" ]; then
            python scripts/scrape/reclameaqui.py ${{ inputs.brands }}
          else
            python scripts/scrape/reclameaqui.py
          fi
